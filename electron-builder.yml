appId: com.smtptester.app
productName: SMTP Tester
directories:
  output: dist
# Auto-update feed + release target: the public downloads repo, so the app can
# check for updates with no authentication.
publish:
  provider: github
  owner: CyberMufti
  repo: smtp-tester-downloads
  releaseType: release
files:
  - src/**/*
  - package.json
  - "!**/*.map"
  # Ship the email-auth sidecar script + its requirements, but never the local
  # virtualenv (platform-specific; users create it from requirements.txt).
  - python/authcheck.py
  - python/requirements.txt
# The sidecar is a real file Python must execute, so keep it out of the asar
# archive (Python can't run a script from inside app.asar).
asarUnpack:
  - python/**
mac:
  artifactName: SMTP-Tester-${version}-${arch}.${ext}
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  artifactName: SMTP-Tester-Setup-${version}.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
