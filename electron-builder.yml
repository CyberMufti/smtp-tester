appId: com.smtptester.app
productName: SMTP Tester
directories:
  output: dist
# Auto-update feed + release target: the public downloads repo, so the app can
# check for updates with no authentication.
publish:
  provider: github
  owner: CyberMufti
  repo: smtp-tester-downloads
  releaseType: release
files:
  - src/**/*
  - package.json
  - "!**/*.map"
  # Ship the email-auth sidecar script + its requirements, but never the local
  # virtualenv (platform-specific; users create it from requirements.txt).
  - python/authcheck.py
  - python/requirements.txt
# The app is ESM ("type": "module") and Electron on Windows fails to load ESM
# entry points from inside app.asar, so ship plain files. This also lets Python
# execute the sidecar script directly (it can't run from inside an archive).
asar: false
# The frozen (PyInstaller) sidecar built in CI — a self-contained binary that
# needs no Python/venv/pip on the user's machine. Copied into
# <resources>/sidecar/authcheck[.exe]. Absent in a plain local build, in which
# case the app auto-provisions a venv instead.
extraResources:
  - from: python/dist
    to: sidecar
    filter:
      - authcheck
      - authcheck.exe
mac:
  artifactName: SMTP-Tester-${version}-${arch}.${ext}
  category: public.app-category.utilities
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  artifactName: SMTP-Tester-Setup-${version}.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
