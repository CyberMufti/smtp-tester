name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    env:
      # Set this repo secret (a token that can write to the public downloads
      # repo) to auto-publish installers. When unset, the publish step is
      # skipped and the build still succeeds.
      DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build ${{ matrix.platform }}
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: smtp-tester-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: ignore

      - name: Publish installer to public downloads release
        if: ${{ env.DOWNLOADS_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
        run: |
          for f in dist/*.exe dist/*.dmg; do
            [ -e "$f" ] || continue
            echo "Publishing $f"
            gh release upload v1.0.0 "$f" --clobber --repo CyberMufti/smtp-tester-downloads
          done
