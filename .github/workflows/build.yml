name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    env:
      # Set this repo secret (a token that can write to the public downloads
      # repo) to auto-publish installers. When unset, the publish step is
      # skipped and the build still succeeds.
      DOWNLOADS_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
      WIN_CERT_B64: ${{ secrets.WINDOWS_CERT_B64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Freeze the email-auth sidecar into a self-contained binary so end users
      # need no Python/venv/pip. Output lands in python/dist/authcheck[.exe],
      # which electron-builder ships as an extraResource. dnspython/dkimpy load
      # submodules dynamically, so collect them explicitly; nacl (ed25519, needs
      # libsodium) is excluded — RSA DKIM verification does not require it.
      - name: Build auth sidecar (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r python/requirements.txt
          pyinstaller --onefile --name authcheck \
            --collect-all dns --collect-all dkim --hidden-import spf \
            --exclude-module nacl \
            --distpath python/dist --workpath python/build --specpath python/build \
            python/authcheck.py
          ls -la python/dist

      - name: Smoke-test the frozen sidecar
        shell: bash
        run: |
          BIN=python/dist/authcheck
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --selfcheck

      # Fetch the GeoIP country database (DB-IP Lite) so electron-builder can
      # bundle it. Best-effort — the script exits 0 even if the download fails.
      - name: Download GeoIP database
        shell: bash
        run: node scripts/download-geoip.mjs

      # Expose code-signing env to electron-builder ONLY on Windows AND only when
      # a cert is configured. Setting CSC_LINK empty on macOS breaks its signing
      # path, so the vars must be absent there — hence this gated step instead of
      # inline `env:` on the build step.
      - name: Prepare Windows code signing
        if: ${{ matrix.platform == 'win' && env.WIN_CERT_B64 != '' }}
        shell: bash
        run: |
          echo "CSC_LINK=$WIN_CERT_B64" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD" >> "$GITHUB_ENV"

      # Build and publish to the public downloads repo. --publish always uploads
      # the installer AND the auto-update metadata (latest.yml / latest-mac.yml +
      # blockmaps) to a release tagged with the package version, so electron-updater
      # can detect and fetch new versions. Falls back to a no-publish build when
      # the token isn't configured.
      - name: Build & publish ${{ matrix.platform }}
        if: ${{ env.DOWNLOADS_TOKEN != '' }}
        run: npx electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}

      - name: Build ${{ matrix.platform }} (no publish)
        if: ${{ env.DOWNLOADS_TOKEN == '' }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: smtp-tester-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: ignore
